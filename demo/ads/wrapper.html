<!doctype html>
<meta charset="utf-8">
<title>ad wrapper</title>
<style>html, body { height: 100%; margin: 0; } iframe { display: block; width: 100%; height: 100%; border: 0; }</style>
<body>
<script>
  // Real ad networks nest frames inside frames. This one just hosts another.
  var f = document.createElement('iframe');
  f.src = 'ad.html?id=' + encodeURIComponent(new URLSearchParams(location.search).get('id') || '');
  document.body.append(f);
</script>
</body>
